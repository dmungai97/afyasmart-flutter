org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation corrupts its own caches on Windows — builds
# fail with "Could not close incremental caches ... caches-jvm/jvm/kotlin"
# while compiling plugin modules (hit on :google_maps_flutter_android).
# Turning it off trades a little rebuild speed for builds that actually
# finish. Safe to revisit if the toolchain fixes the file-locking behaviour.
kotlin.incremental=false
